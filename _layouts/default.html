<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  <link rel="icon" type="image/png" href="{{ '/branding/icon_1024.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/branding/icon_1024.png' | relative_url }}">
  <style>
    /* The app icon's palette: sumi tile, paper text, 利休 accent. */
    :root {
      --bg: #f6f3ec; --surface: #ffffff; --text: #18181a; --muted: #5d5c58;
      --accent: #646c36; --line: #e3ded2; --code: #efebe1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151416; --surface: #1f1e21; --text: #f2eee4; --muted: #a9a59b;
        --accent: #b6c07a; --line: #2f2d31; --code: #232225;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 760px; margin: 0 auto; padding: 40px 16px 24px; }
    img { max-width: 100%; height: auto; }
    img[src*="banner"] { display: block; margin: 0 0 8px; }
    img[src*="screenshots/"] { display: block; margin: 32px auto; border-radius: 16px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, .28); }
    h1 { font-size: 2.4rem; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 12px; }
    h1 + p { font-size: 1.2rem; color: var(--muted); }
    h2 { font-size: 1.45rem; margin: 48px 0 12px; padding-top: 24px; border-top: 1px solid var(--line); }
    h3 { font-size: 1.1rem; margin: 28px 0 8px; }
    a { color: var(--accent); text-underline-offset: 3px; }
    code { font: .88em ui-monospace, "SF Mono", Menlo, monospace; background: var(--code);
      padding: .12em .4em; border-radius: 5px; }
    pre { background: var(--code); padding: 14px 16px; border-radius: 10px; overflow-x: auto; }
    pre code { background: none; padding: 0; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: .95rem;
      display: block; overflow-x: auto; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; }
    footer { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; color: var(--muted);
      font-size: .9rem; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <main>
{{ content }}
  </main>
  <footer>
    <a href="https://github.com/zeetabit/Hertzwise">Source on GitHub</a> ·
    <a href="https://github.com/zeetabit/Hertzwise/releases/latest">Download</a> ·
    MIT license
  </footer>
</body>
</html>
